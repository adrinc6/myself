<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .box{fill:#f4f6f8;stroke:#5b6b7c;stroke-width:1.5;rx:6}
    .mine{fill:#e8f0fb;stroke:#2f5d8f;stroke-width:2;rx:6}
    .other{fill:#f0eef4;stroke:#6b5b8a;stroke-width:1.6;rx:6;stroke-dasharray:5 3}
    .tb{font-size:13px;fill:#1d2733;font-weight:600}
    .s{font-size:11px;fill:#5b6b7c}
    .ti{font-size:16px;fill:#1d2733;font-weight:600}
    .zone{font-size:12px;font-weight:600}
    .ar{stroke:#5b6b7c;stroke-width:1.5;fill:none;marker-end:url(#a)}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect fill="#ffffff" width="880" height="460"/>
  <text class="ti" x="24" y="30">De modelo entrenado a servicio en uso</text>
  <text class="s" x="24" y="50">Esquema genérico. La frontera marca qué parte es aportación propia y cuál no.</text>

  <rect x="24" y="76" width="380" height="300" fill="#faf9fb" stroke="#6b5b8a" stroke-width="1.4" stroke-dasharray="6 4" rx="8"/>
  <text class="zone" x="44" y="100" fill="#6b5b8a">TRABAJO DE OTRA PERSONA</text>

  <rect class="other" x="48" y="116" width="150" height="52"/>
  <text class="tb" x="123" y="138" text-anchor="middle">Conjunto de datos</text>
  <text class="s" x="123" y="156" text-anchor="middle">generación y curado</text>

  <rect class="other" x="230" y="116" width="150" height="52"/>
  <text class="tb" x="305" y="138" text-anchor="middle">Arquitectura</text>
  <text class="s" x="305" y="156" text-anchor="middle">diseño de la red</text>

  <rect class="other" x="48" y="192" width="150" height="52"/>
  <text class="tb" x="123" y="214" text-anchor="middle">Entrenamiento</text>
  <text class="s" x="123" y="232" text-anchor="middle">ajuste de hiperparámetros</text>

  <rect class="other" x="230" y="192" width="150" height="52"/>
  <text class="tb" x="305" y="214" text-anchor="middle">Validación</text>
  <text class="s" x="305" y="232" text-anchor="middle">métricas del modelo</text>

  <rect class="other" x="139" y="268" width="150" height="52"/>
  <text class="tb" x="214" y="290" text-anchor="middle">Exportación</text>
  <text class="s" x="214" y="308" text-anchor="middle">a formato de intercambio</text>

  <text class="s" x="214" y="348" text-anchor="middle">El modelo y su calidad no son aportación mía.</text>

  <path class="ar" d="M289,294 L432,294 L432,222"/>

  <rect x="452" y="76" width="404" height="300" fill="#f7fafd" stroke="#2f5d8f" stroke-width="1.6" rx="8"/>
  <text class="zone" x="472" y="100" fill="#2f5d8f">APORTACIÓN PROPIA</text>

  <rect class="mine" x="476" y="116" width="164" height="52"/>
  <text class="tb" x="558" y="138" text-anchor="middle">Runtime de inferencia</text>
  <text class="s" x="558" y="156" text-anchor="middle">sin el marco de entrenamiento</text>

  <rect class="mine" x="668" y="116" width="164" height="52"/>
  <text class="tb" x="750" y="138" text-anchor="middle">Dependencias aparte</text>
  <text class="s" x="750" y="156" text-anchor="middle">despliegue ≠ entrenamiento</text>

  <rect class="mine" x="476" y="196" width="164" height="52"/>
  <text class="tb" x="558" y="218" text-anchor="middle">API del servicio</text>
  <text class="s" x="558" y="236" text-anchor="middle">carga única, reutilizada</text>

  <rect class="mine" x="668" y="196" width="164" height="52"/>
  <text class="tb" x="750" y="218" text-anchor="middle">Entradas curadas</text>
  <text class="s" x="750" y="236" text-anchor="middle">procesable vs. no procesable</text>

  <rect class="mine" x="572" y="276" width="164" height="52"/>
  <text class="tb" x="654" y="298" text-anchor="middle">Interfaz de resultados</text>
  <text class="s" x="654" y="316" text-anchor="middle">tabla, medidas, explicación</text>

  <path class="ar" d="M558,168 L558,196"/>
  <path class="ar" d="M558,248 L558,276 L572,276"/>

  <path class="ar" d="M736,302 L800,302 L800,352"/>
  <rect class="box" x="700" y="352" width="156" height="48"/>
  <text class="tb" x="778" y="373" text-anchor="middle">Persona usuaria</text>
  <text class="s" x="778" y="390" text-anchor="middle">revisa el resultado</text>

  <text class="s" x="24" y="410">Un modelo en un cuaderno no es un producto: falta la API, la interfaz, el control de entradas y el entorno de ejecución.</text>
  <text class="s" x="24" y="430">Esa mitad derecha es la habilidad; la izquierda, en este proyecto, no es mía.</text>
</svg>
